<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';src:url('/public/fonts/inter-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#0b0c0e}
.og{position:relative;width:1200px;height:630px;background:#0b0c0e;font-family:'Inter',system-ui,sans-serif;color:#EBECEC;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(760px 540px at 79% 46%,rgba(235,236,236,.11),rgba(235,236,236,0) 62%),radial-gradient(620px 400px at 6% 0%,rgba(52,199,123,.055),rgba(52,199,123,0) 66%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.055) 1.1px,rgba(255,255,255,0) 1.4px);background-size:14px 14px}
.brand{position:absolute;left:84px;top:78px;display:flex;align-items:center;gap:15px}
.brand svg{width:48px;height:48px;display:block}
.brand b{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
h1{position:absolute;left:82px;top:240px;margin:0;font-size:67px;line-height:1.05;font-weight:500;letter-spacing:-.035em;color:#F4F5F5}
h1 span{color:#8A8E95}
.sub{position:absolute;left:84px;top:452px;margin:0;font-size:26px;font-weight:400;letter-spacing:-.012em;color:#9AA0A8}
.tile{position:absolute;left:808px;top:163px;width:292px;height:292px}
.tile svg{width:292px;height:292px;display:block}
</style></head>
<body><div class="og">
<div class="glow"></div><div class="dots"></div>
<div class="brand"><svg viewBox="0 0 100 100"><defs><mask id="ag-mark"><rect width="100" height="100" fill="#fff"/><path d="M50 20 L74 78 L61.5 78 L57 66 L43 66 L38.5 78 L26 78 Z M50 41 L53.5 58 L46.5 58 Z" fill="#000" fill-rule="evenodd"/></mask></defs><rect width="100" height="100" rx="16" fill="#EBECEC" mask="url(#ag-mark)"/></svg><b>Agpool</b></div>
<h1>Private payments<br><span>that leave no trail</span></h1>
<p class="sub">Shield &middot; send &middot; swap &middot; bridge &mdash; zero-knowledge, across chains</p>
<div class="tile"><svg viewBox="0 0 100 100"><defs><mask id="ag-mark"><rect width="100" height="100" fill="#fff"/><path d="M50 20 L74 78 L61.5 78 L57 66 L43 66 L38.5 78 L26 78 Z M50 41 L53.5 58 L46.5 58 Z" fill="#000" fill-rule="evenodd"/></mask></defs><rect width="100" height="100" rx="16" fill="#EBECEC" mask="url(#ag-mark)"/></svg></div>
</div></body></html>
